# SPDX-License-Identifier: CC0-1.0
# libcamera software ISP tuning for the SR259 (front), not calibrated
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  # Saturation 2.1 around Rec.601 luminance; rows sum to 1
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [  1.7711, -0.6457, -0.1254,
                 -0.3289,  1.4543, -0.1254,
                 -0.3289, -0.6457,  1.9746 ]
  - Lut:
      gamma: 0.4
      contrast: 1.3
  # flickerPeriod: against banding from 50 Hz lights
  - Agc:
      flickerPeriod: 10000
      msvMin: 2.3
      saturatedMax: 0.04
  - Af:
...
